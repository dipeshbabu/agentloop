services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentloop}
      POSTGRES_USER: ${POSTGRES_USER:-agentloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentloop} -d ${POSTGRES_DB:-agentloop}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    image: agentloop:local
    environment:
      AGENTLOOP_STORE_BACKEND: postgres
      AGENTLOOP_DATABASE_URL: postgresql://${POSTGRES_USER:-agentloop}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-agentloop}
      AGENTLOOP_REQUIRE_API_KEY: "true"
      AGENTLOOP_ADMIN_API_KEY: ${AGENTLOOP_ADMIN_API_KEY:?Set AGENTLOOP_ADMIN_API_KEY in .env}
      AGENTLOOP_CORS_ORIGINS: ${AGENTLOOP_CORS_ORIGINS:-http://localhost:8501}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz'))['status'] == 'ready'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    image: agentloop:local
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    environment:
      AGENTLOOP_STORE_BACKEND: postgres
      AGENTLOOP_DATABASE_URL: postgresql://${POSTGRES_USER:-agentloop}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-agentloop}
      AGENTLOOP_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  postgres_data:
