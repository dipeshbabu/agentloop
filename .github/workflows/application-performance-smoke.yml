name: Application workflow smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    name: Prepare synthetic workflow fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Prepare explicitly synthetic fixtures
        run: |
          uv run --frozen --no-dev agentloop quickstart --out inputs/baseline.json
          cp inputs/baseline.json inputs/candidate.json
          printf '%s\n' '[{"id":"smoke","baseline_output":"ok","candidate_output":"ok","expected":"ok"}]' > inputs/quality.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-application-traces
          path: inputs/
          if-no-files-found: error
  compare:
    needs: fixtures
    uses: ./.github/workflows/application-performance.yml
    with:
      trace_artifact: synthetic-application-traces
      quality_fixtures: quality.json
      min_quality_score: "1.0"
      agentloop_ref: ${{ github.sha }}
      report_artifact: application-workflow-smoke-reports
  verify:
    name: Verify trace provenance in reusable workflow output
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-workflow-smoke-reports
          path: reports
      - name: Verify supplied artifacts and quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/agentloop_ci.json").read_text())
          assert report["passed"]
          assert report["evidence_scope"] == "includes_synthetic_data"
          for side in ("baseline", "candidate"):
              assert report["trace_inputs"][side]["synthetic"] is True
              assert report["trace_inputs"][side]["path"].endswith(f"inputs/{side}.json")
          assert report["replay"]["quality"]["passed"]
          PY
