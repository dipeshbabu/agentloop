name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload_release_artifact:
        description: Upload the validated distributions for a caller to publish
        required: false
        type: boolean
        default: false
  # Lets bump-version.yml (which opens its release-prep PR with the default
  # GITHUB_TOKEN, so the push/pull_request triggers above never fire for it — see
  # the comment in bump-version.yml) get this workflow's jobs to run and report
  # against that PR's head commit via `gh workflow run ci.yml --ref <branch>`.
  # workflow_dispatch is exempt from GitHub's anti-recursion rule for GITHUB_TOKEN-
  # authored events, unlike push/pull_request.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentloop
          POSTGRES_PASSWORD: agentloop-ci-test-only
          POSTGRES_DB: agentloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentloop -d agentloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGENTLOOP_TEST_POSTGRES_DSN: postgresql://agentloop:agentloop-ci-test-only@localhost:5432/agentloop_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package
        run: uv sync --locked --all-extras --dev

      - name: Code quality
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Wait for Postgres readiness
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U agentloop -d agentloop_test; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres service did not become ready" >&2
          exit 1

      - name: Test
        run: uv run --frozen --all-extras python -m pytest -q

      - name: Smoke CLI workflows
        if: matrix.python-version == '3.13'
        run: |
          uv run --frozen agentloop --help
          uv run --frozen agentloop demo-all
          uv run --frozen agentloop compare
          uv run --frozen agentloop diagnose --path runs/agentloop_proof_baseline.json --out runs/diagnosis.md --json-out runs/diagnosis.json
          uv run --frozen agentloop patch --path runs/agentloop_proof_baseline.json --repo . --out runs/patch_plan.md --json-out runs/patch_plan.json
          uv run --frozen agentloop replay --baseline runs/research_agent_baseline.json --candidate runs/research_agent_optimized.json --out runs/replay_report.md --json-out runs/replay_report.json
          uv run --frozen agentloop ci --baseline runs/research_agent_baseline.json --candidate runs/research_agent_optimized.json --out runs/agentloop_ci.md --json-out runs/agentloop_ci.json
          uv run --frozen agentloop quality-report examples/quality_fixtures.json --out runs/quality_report.md --json-out runs/quality_report.json --min-score 0.9
          uv run --frozen agentloop audit --path runs/research_agent_baseline.json --out runs/audit.md
          uv run --frozen agentloop optimize --path runs/research_agent_baseline.json --out runs/optimization_plan.md --json-out runs/optimization_plan.json
          uv run --frozen agentloop value-report --path runs/research_agent_baseline.json --out runs/value_report.json --runs-per-month 5000
          uv run --frozen agentloop export-otel runs/research_agent_baseline.json runs/research_agent_baseline.otel.json
          uv run --frozen agentloop import-otel runs/research_agent_baseline.otel.json runs/imported_trace.json --name imported-agent
          uv run --frozen agentloop init-store
          uv run --frozen agentloop store-trace --path runs/research_agent_baseline.json --project-id ci-smoke
          uv run --frozen agentloop list-stored-traces --project-id ci-smoke
          uv run --frozen agentloop usage-summary --project-id ci-smoke

  package:
    name: Package artifact and wheel smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Build distribution once
        run: uv build

      - name: Validate distribution metadata
        run: uv run --isolated --no-project --with twine twine check dist/*

      - name: Install wheel and smoke CLI
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.13 .package-smoke
          uv pip install --python .package-smoke/bin/python "$wheel"
          .package-smoke/bin/agentloop --help

      - name: Upload validated release artifact
        if: ${{ inputs.upload_release_artifact || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

      - name: Download validated release artifact
        if: ${{ inputs.upload_release_artifact || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: .artifact-download-smoke

      - name: Verify downloaded artifact bytes
        if: ${{ inputs.upload_release_artifact || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          diff -u \
            <(cd dist && sha256sum * | sort) \
            <(cd .artifact-download-smoke && sha256sum * | sort)

  standalone:
    name: Standalone CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            extension: ""
          - os: windows-2025
            target: windows-x86_64
            extension: .exe
          - os: macos-15-intel
            target: macos-x86_64
            extension: ""
          - os: macos-15
            target: macos-arm64
            extension: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Install standalone build dependencies
        run: uv sync --locked --no-dev --group standalone

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build standalone executable
        shell: bash
        run: |
          uv run --frozen --no-dev --group standalone pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --paths . \
            --name "agentloop-v${{ steps.version.outputs.version }}-${{ matrix.target }}" \
            scripts/agentloop_cli.py

      - name: Generate standalone dependency notices
        shell: bash
        run: |
          notice="dist/THIRD_PARTY_NOTICES-${{ matrix.target }}.txt"
          uv run --frozen --no-dev --group standalone python \
            scripts/generate_standalone_notices.py \
            --target "${{ matrix.target }}" \
            --output "$notice"
          test -s "$notice"

      - name: Smoke standalone executable
        shell: bash
        run: |
          artifact="agentloop-v${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.extension }}"
          executable="$PWD/dist/$artifact"
          test -f "$executable"
          "$executable" --help
          smoke_dir="$RUNNER_TEMP/agentloop-standalone-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          "$executable" demo --kind baseline
          report_output="$smoke_dir/report.txt"
          "$executable" report runs/research_agent_baseline.json > "$report_output"
          test -s "$report_output"
          test -s runs/research_agent_baseline.json

      - name: Upload standalone executable
        if: ${{ inputs.upload_release_artifact || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.target }}
          path: |
            dist/agentloop-v${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.extension }}
            dist/THIRD_PARTY_NOTICES-${{ matrix.target }}.txt
          if-no-files-found: error

  docker:
    name: Docker image and deployment smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure synthetic smoke secrets
        shell: bash
        run: |
          db_password="p@/s?s#1%2:$(openssl rand -hex 12)"
          admin_key="ci-admin-$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_key"
          echo "POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "AGENTLOOP_ADMIN_API_KEY=$admin_key" >> "$GITHUB_ENV"

      - name: Build exact image used by Compose
        run: docker build --tag agentloop:local .

      - name: Validate Compose configuration without rendering secrets
        run: docker compose config --quiet

      - name: Start deployment stack
        run: docker compose up --detach --no-build

      - name: Wait for API and dashboard readiness
        shell: bash
        run: |
          wait_for_url() {
            local name="$1"
            local url="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready" >&2
            return 1
          }
          wait_for_url "AgentLoop API" "http://127.0.0.1:8000/readyz"
          wait_for_url "AgentLoop dashboard" "http://127.0.0.1:8501/_stcore/health"

      - name: Verify Python version and runtime filesystem posture
        shell: bash
        run: |
          docker compose exec -T api python -c \
            "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
          docker compose exec -T api sh -c 'test "$(id -u)" -ne 0'
          docker compose exec -T api sh -c \
            "touch /data/container-write-check && rm /data/container-write-check"
          if docker compose exec -T api sh -c "test -w /app"; then
            echo "Runtime user must not be able to write to /app" >&2
            exit 1
          fi

      - name: Verify API trace round-trip
        env:
          AGENTLOOP_API_URL: http://127.0.0.1:8000
        run: python3 scripts/smoke_api.py

      - name: Verify dashboard database connectivity
        run: |
          docker compose exec -T dashboard python -c \
            "from agentloop.store import get_store; get_store().usage_summary(project_id='default')"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop deployment stack
        if: always()
        run: docker compose down --volumes --remove-orphans
