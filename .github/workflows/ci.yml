name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package
        run: uv sync --locked --all-extras --dev

      - name: Code quality
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Test
        run: uv run --frozen --all-extras python -m pytest -q

      - name: Smoke CLI workflows
        if: matrix.python-version == '3.13'
        run: |
          uv run --frozen agentloop --help
          uv run --frozen agentloop demo-all
          uv run --frozen agentloop compare
          uv run --frozen agentloop diagnose --path runs/agentloop_proof_baseline.json --out runs/diagnosis.md --json-out runs/diagnosis.json
          uv run --frozen agentloop patch --path runs/agentloop_proof_baseline.json --repo . --out runs/patch_plan.md --json-out runs/patch_plan.json
          uv run --frozen agentloop replay --baseline runs/research_agent_baseline.json --candidate runs/research_agent_optimized.json --out runs/replay_report.md --json-out runs/replay_report.json
          uv run --frozen agentloop ci --baseline runs/research_agent_baseline.json --candidate runs/research_agent_optimized.json --out runs/agentloop_ci.md --json-out runs/agentloop_ci.json
          uv run --frozen agentloop quality-report examples/quality_fixtures.json --out runs/quality_report.md --json-out runs/quality_report.json --min-score 0.9
          uv run --frozen agentloop audit --path runs/research_agent_baseline.json --out runs/audit.md
          uv run --frozen agentloop optimize --path runs/research_agent_baseline.json --out runs/optimization_plan.md --json-out runs/optimization_plan.json
          uv run --frozen agentloop value-report --path runs/research_agent_baseline.json --out runs/value_report.json --runs-per-month 5000
          uv run --frozen agentloop export-otel runs/research_agent_baseline.json runs/research_agent_baseline.otel.json
          uv run --frozen agentloop import-otel runs/research_agent_baseline.otel.json runs/imported_trace.json --name imported-agent
          uv run --frozen agentloop init-store
          uv run --frozen agentloop store-trace --path runs/research_agent_baseline.json --project-id ci-smoke
          uv run --frozen agentloop list-stored-traces --project-id ci-smoke
          uv run --frozen agentloop usage-summary --project-id ci-smoke

      - name: Build package
        run: uv build

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image
        run: docker build .
