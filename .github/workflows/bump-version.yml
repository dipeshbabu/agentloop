name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: >-
          patch (default) for routine changes and fixes; minor only for a
          notable user-facing feature; major only for a breaking change.
          Ignored if version is set.
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version to set instead of bump_type, e.g. 1.2.3
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate main before release-prep
    uses: ./.github/workflows/ci.yml

  bump:
    name: Open release-prep pull request
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Install package
        run: uv sync --locked --all-extras --dev

      - name: Bump version and roll the changelog
        id: bump
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            new_version="$(uv run --frozen python scripts/bump_version.py --set "${{ inputs.version }}")"
          else
            new_version="$(uv run --frozen python scripts/bump_version.py "${{ inputs.bump_type }}")"
          fi
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push the release-prep branch
        env:
          BRANCH: release/${{ steps.bump.outputs.version }}
        run: |
          git checkout -b "$BRANCH"
          git add pyproject.toml agentloop/version.py uv.lock CHANGELOG.md
          git commit -m "Prepare agentloop-profiler ${{ steps.bump.outputs.version }} release"
          git push --force origin "$BRANCH"

      - name: Open the release-prep pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/${{ steps.bump.outputs.version }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Prepare agentloop-profiler $VERSION release" \
            --body "$(cat <<EOF
          Automated release-prep pull request opened by the **Bump version** workflow.

          - Moved \`## [Unreleased]\` into a new \`## [$VERSION]\` section in \`CHANGELOG.md\`.
          - Bumped \`pyproject.toml\` and \`agentloop/version.py\` to \`$VERSION\` in lockstep.
          - Refreshed \`uv.lock\`.

          The full CI suite (lint, tests on both supported Python versions against
          SQLite and Postgres, package build, Docker deployment smoke) already ran
          against \`main\` as the \`validate\` job of this same workflow run before
          this branch was created. Because this PR was opened with the default
          \`GITHUB_TOKEN\`, GitHub does not start a separate \`pull_request\`-triggered
          CI run for it (a GitHub Actions anti-recursion restriction) — so this
          workflow separately dispatches \`ci.yml\`, \`codeql.yml\`,
          \`dependency-review.yml\`, and \`agentloop-performance.yml\` against this
          branch (workflow_dispatch is exempt from that restriction) so the checks
          branch protection requires actually run and report here. Give them a minute
          to appear if they're not showing yet.

          If any of those four checks are still missing after a few minutes (the
          dispatch call itself failed, rather than the check failing), push any commit
          to this branch or close and reopen this PR yourself — either done with your
          own account rather than a bot token — which triggers them the normal way.

          Review the changelog placement and version choice, then merge normally.
          Merging pushes to \`main\`, which triggers \`tag-release.yml\`: it creates
          and pushes the matching \`v$VERSION\` tag and dispatches \`release.yml\`
          against it automatically. Publishing to PyPI still requires the \`pypi\`
          environment's required-reviewer approval — nothing publishes without a
          human clicking approve.
          EOF
          )"

      # Branch protection on main requires named checks with no bypass (see
      # docs/RELEASING.md). Those checks come from ci.yml, codeql.yml,
      # dependency-review.yml, and agentloop-performance.yml's pull_request
      # triggers, which — like this PR itself — never fire for a GITHUB_TOKEN-
      # authored event. Dispatch each of them directly against this branch instead;
      # workflow_dispatch is exempt from that restriction, and each of these
      # workflows' job names match the required-check names exactly, so a
      # successful dispatch run satisfies the requirement the same way a native
      # pull_request run would.
      - name: Dispatch the branch-protection-required checks against this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/${{ steps.bump.outputs.version }}
        run: |
          for workflow in ci.yml codeql.yml dependency-review.yml agentloop-performance.yml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
