name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets tag-release.yml (which pushes tags with the default GITHUB_TOKEN, so
  # the push above never fires for it — see the comment in tag-release.yml)
  # start this workflow via `gh workflow run release.yml --ref <tag>`. Running
  # with --ref set to a tag gives this run the same github.ref/GITHUB_REF_NAME
  # a real tag push would, so the guard job below needs no special-casing for
  # this trigger type. A manual dispatch against a branch (not a tag) still
  # fails the "Check tag matches package version" step, same as it always has.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Verify release ref
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Check tag matches package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Require tag commit on main
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

  validate:
    name: Validate exact tag commit
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      upload_release_artifact: true

  publish-pypi:
    name: Publish to PyPI
    needs: [guard, validate]
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package
          path: dist

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
