name: Publish release

on:
  push:
    tags:
      - "v*.*.*"
  # Explicit dispatch supports recovering a tagged release. Branch dispatches
  # fail the same exact-tag and main-reachability checks as every other run.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify release ref
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Check tag matches package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Require an annotated semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "$GITHUB_REF")" = tag

      - name: Require tag commit on main
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

  validate:
    name: Validate exact tag commit
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      upload_release_artifact: true

  publish-pypi:
    name: Publish to PyPI
    needs: [guard, validate]
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github:
    name: Publish GitHub release
    needs: [guard, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: release-assets

      - name: Download standalone executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - name: Add notices and checksums
        shell: bash
        run: |
          cp LICENSE THIRD_PARTY_LICENSES.md release-assets/
          cd release-assets
          for target in linux-x86_64 windows-x86_64 macos-x86_64 macos-arm64; do
            test -s "THIRD_PARTY_NOTICES-${target}.txt"
          done
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Extract this release's changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"][1:]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[Unreleased\]:|\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          if match is None or not match.group(1).strip():
              raise SystemExit("Missing nonempty changelog for the exact release version")
          Path("release-notes.txt").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: Create release and upload validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --latest \
              --notes-file release-notes.txt \
              --title "AgentLoop $version"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
