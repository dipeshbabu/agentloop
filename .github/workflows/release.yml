name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets tag-release.yml (which pushes tags with the default GITHUB_TOKEN, so
  # the push above never fires for it — see the comment in tag-release.yml)
  # start this workflow via `gh workflow run release.yml --ref <tag>`. Running
  # with --ref set to a tag gives this run the same github.ref/GITHUB_REF_NAME
  # a real tag push would, so the guard job below needs no special-casing for
  # this trigger type. A manual dispatch against a branch (not a tag) still
  # fails the "Check tag matches package version" step, same as it always has.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Verify release ref
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Check tag matches package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Require tag commit on main
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

  validate:
    name: Validate exact tag commit
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      upload_release_artifact: true

  publish-pypi:
    name: Publish to PyPI
    needs: [guard, validate]
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  publish-github:
    name: Publish GitHub release
    needs: [guard, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: release-assets

      - name: Download standalone executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - name: Add notices and checksums
        shell: bash
        run: |
          cp LICENSE THIRD_PARTY_LICENSES.md release-assets/
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Create release and upload validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "AgentLoop $version"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
