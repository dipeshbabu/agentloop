name: Demo video

on:
  pull_request:
    paths:
      - "video/**"
      - "examples/intervention_study.py"
      - ".github/workflows/demo-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Remotion demo render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Verify the demo against real AgentLoop output
        run: |
          uv sync --locked --no-dev
          uv run --frozen --no-dev python video/scripts/prepare-data.py --check
      - name: Install video tooling
        working-directory: video
        run: npm ci
      - name: Check types and evidence
        working-directory: video
        run: npm run check
      - name: Render the complete demo
        working-directory: video
        run: npm run render
      - name: Upload the video and captions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentloop-demo
          path: |
            video/out/agentloop-demo.mp4
            video/out/agentloop-demo.srt
          if-no-files-found: error
