[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloop-profiler"
version = "0.2.1"
description = "Profiler and optimization layer for AI agent execution graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Dipesh Tharu Mahato" }]
keywords = ["ai-agents", "agent-evaluation", "observability", "optimization", "profiling", "research", "tracing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.34.0",
  "pandas>=2.0.0",
  "pillow>=13.0.0",
  "certifi>=2026.10.18",
  "urllib3>=2.8.0",
]
server = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
postgres = ["psycopg[binary]>=3.3.8"]
instrumentation = ["openai>=1.0.0", "certifi>=2026.10.18"]
all = [
  "streamlit>=1.34.0",
  "pandas>=2.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "psycopg[binary]>=3.3.8",
  "openai>=1.0.0",
  "pillow>=13.0.0",
  "certifi>=2026.10.18",
  "urllib3>=2.8.0",
]

[dependency-groups]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.8.1",
]
standalone = [
  "pyinstaller>=6.21.0,<7",
  "setuptools>=84.1.0",
]
dev = [
  "bandit>=1.9.4,<2",
  "httpx2>=2.12.0",
  "pre-commit>=4.6.0,<5",
  "pytest>=8.0.0",
  "ruff>=0.12.0,<1",
  "filelock>=4.2.1",
  "virtualenv>=21.14.9",
  "certifi>=2026.10.18",
]

[project.urls]
Homepage = "https://github.com/dipeshbabu/agentloop"
Documentation = "https://dipeshbabu.github.io/agentloop/"
Repository = "https://github.com/dipeshbabu/agentloop.git"
Issues = "https://github.com/dipeshbabu/agentloop/issues"
Changelog = "https://github.com/dipeshbabu/agentloop/blob/main/CHANGELOG.md"

[project.scripts]
agentloop = "agentloop.entrypoint:app"

[project.entry-points."hermes_agent.plugins"]
agentloop = "agentloop.integrations.hermes_recorder:register"

[tool.setuptools.packages.find]
include = ["agentloop*", "dashboard*"]
exclude = ["runs*", "sdk*", "tests*", "build*", "dist*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"] # Ruff's formatter owns line wrapping.

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "*.egg-info",
  "runs",
]

[tool.uv]
required-version = ">=0.11.8,<0.12"
# Security floors and Python-specific binary compatibility requirements.
constraint-dependencies = [
  "urllib3>=2.8.0",
  "virtualenv>=21.14.9",
  "filelock>=4.2.1",
  "certifi>=2026.10.18",
  "pillow>=13.0.0",
  "setuptools>=84.1.0",
  # Arrow 24 supports the oldest Python floor, but has no Python 3.15 wheels.
  "pyarrow>=26.0.1; python_version >= '3.15'",
]
