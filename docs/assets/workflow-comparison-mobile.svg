<svg xmlns="http://www.w3.org/2000/svg" width="480" height="965" viewBox="0 0 480 965" role="img" aria-labelledby="title desc"><title id="title">Without and with AgentLoop</title><desc id="desc">Your agent supplies execution evidence. Without AgentLoop, custom timing, token parsing, retry analysis, output checks and report code must be connected. With AgentLoop, decorators and adapters record a trace for analysis, replay with your fixtures, and reviewable reports.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r=".65" fill="#eae2f3"/></pattern></defs><rect x="0.75" y="0.75" width="478.5" height="963.5" rx="12" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><rect x="2" y="70" width="476" height="823" fill="#fdfbff"/><rect x="2" y="70" width="476" height="823" fill="url(#dots)"/><text x="28" y="33" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">WITHOUT AGENTLOOP</text><rect x="127" y="60" width="226" height="69" rx="9" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><svg x="145" y="70.5" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d96559" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h8v3H8zM12 2v3M5 8h14v12H5zM2 12v4M22 12v4M9 12v2M15 12v2M9 17h6"/></svg><text x="181" y="92.5" fill="#30263d" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start">Your agent</text><text x="240" y="121.5" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">models · tools · retries</text><path d="M240 129V169" fill="none" stroke="#c0b4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M234 162l6 7 6-7" fill="none" stroke="#c0b4cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="65" y="170" width="350" height="125" rx="9" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><svg x="95" y="185" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#766c83" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 17h18M8 3v8M16 13v8"/></svg><text x="135" y="207" fill="#30263d" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start">Custom profiling</text><text x="240" y="242" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Timing · usage · retries</text><text x="240" y="271" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Output checks · reports</text><path d="M240 295V334" fill="none" stroke="#c0b4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M234 327l6 7 6-7" fill="none" stroke="#c0b4cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="52" y="335" width="376" height="76" rx="9" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><svg x="70" y="349" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d96559" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h15V8zM14 2v6h6M8 15l3 3 5-6"/></svg><text x="106" y="371" fill="#30263d" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">Metrics · comparisons · reports</text><text x="240" y="400" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">Use the quality checks your task needs.</text><path d="M25 449H455" fill="none" stroke="#dfd6e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="28" y="497" fill="#7038c9" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">WITH AGENTLOOP</text><rect x="127" y="524" width="226" height="69" rx="9" fill="#ff