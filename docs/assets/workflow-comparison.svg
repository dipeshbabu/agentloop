<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc"><title id="title">Without and with AgentLoop</title><desc id="desc">Your agent supplies execution evidence. Without AgentLoop, custom timing, token parsing, retry analysis, output checks and report code must be connected. With AgentLoop, decorators and adapters record a trace for analysis, replay with your fixtures, and reviewable reports.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r=".65" fill="#eae2f3"/></pattern></defs><rect x="0.75" y="0.75" width="1278.5" height="538.5" rx="12" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><rect x="2" y="70" width="1276" height="398" fill="#fdfbff"/><rect x="2" y="70" width="1276" height="398" fill="url(#dots)"/><text x="31" y="41" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">WITHOUT AGENTLOOP</text><rect x="35" y="100" width="225" height="80" rx="9" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><svg x="53" y="116" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d96559" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h8v3H8zM12 2v3M5 8h14v12H5zM2 12v4M22 12v4M9 12v2M15 12v2M9 17h6"/></svg><text x="89" y="138" fill="#30263d" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start">Your agent</text><text x="147.5" y="167" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">models · tools · retries</text><path d="M260 140H440" fill="none" stroke="#c0b4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M434 134l6 6-6 6" fill="none" stroke="#c0b4cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="440" y="76" width="376" height="130" rx="9" fill="#fffff