<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1110" viewBox="0 0 480 1110" role="img" aria-labelledby="title desc"><title id="title">AgentLoop architecture</title><desc id="desc">Your agent calls models and tools. AgentLoop records instrumented spans and exports trace JSON. Analyze produces metrics and findings. Replay compares the trace with a baseline and your quality fixtures. Both produce reviewable reports.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r=".65" fill="#eae2f3"/></pattern></defs><rect x="0.75" y="0.75" width="478.5" height="1108.5" rx="12" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><rect x="2" y="70" width="476" height="968" fill="#fdfbff"/><rect x="2" y="70" width="476" height="968" fill="url(#dots)"/><text x="26" y="44" fill="#30263d" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start">Your agent. Recorded evidence.</text><rect x="20" y="92" width="440" height="342" rx="9" fill="none" stroke="#dfd6e9" stroke-width="1.4" stroke-dasharray="6 5"/><text x="37" y="118" fill="#766c83" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">YOUR APPLICATION</text><rect x="155" y="139" width="170" height="58" rx="9" fill="#ffffff" stroke="#dfd6e9" stroke-width="1.4" /><svg x="173" y="154" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d96559" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6v17h12V4h-3M9 2h6v4H9zM8 12l2 2 5-5M8 18h7"/></svg><text x="209" y="176" fill="#30263d" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">Task</text><path d="M240 197v31" fill="none" stroke="#d96559" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M234 221l6 7 6-7" fill="none" stroke="#d96559" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="