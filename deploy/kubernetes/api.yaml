apiVersion: v1
kind: Service
metadata:
  name: agentloop-api
  labels:
    app.kubernetes.io/name: agentloop-api
spec:
  selector:
    app.kubernetes.io/name: agentloop-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentloop-api
  labels:
    app.kubernetes.io/name: agentloop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentloop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentloop-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: agentloop
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agentloop-config
            - secretRef:
                name: agentloop-secrets
          env:
            - name: AGENTLOOP_STORE_BACKEND
              value: postgres
            - name: AGENTLOOP_REQUIRE_API_KEY
              value: "true"
            - name: AGENTLOOP_API_DOCS
              value: "false"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
